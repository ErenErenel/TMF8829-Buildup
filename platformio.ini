; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_h563zi]
platform = ststm32
board = nucleo_h563zi
framework = arduino
; Upload goes over SWD via pyocd, NOT the ST-LINK's mbed virtual disk.
;
; Why: this machine's Defender Device Control filter driver (WdDevFlt) fails
; to attach to USB mass-storage volumes (Kernel-PnP event 219, status
; 0xC000038E, naming the MBED volume), so the volume stack never finishes
; building -- the disk and its FAT16 partition enumerate but no volume and no
; drive letter are ever created. `upload_protocol = mbed` therefore cannot
; work here, and neither can `jlink` (the probe is a stock ST-LINK V3E,
; 0483:374E, not J-Link OB). The ST-LINK *debug* interface is unaffected.
;
; Mainline OpenOCD (PlatformIO's tool-openocd) has no STM32H5 flash driver --
; only ST's own fork does -- so pyocd + the Keil STM32H5xx_DFP pack is the
; path that works with no admin rights and no ST account. One-time setup:
;   .venv\Scripts\python.exe -m pyocd pack update
;   .venv\Scripts\python.exe -m pyocd pack install stm32h563zitx
; Machine-specific: .venv is gitignored, so this line assumes the repo-root
; venv described in CLAUDE.md. On a host with a working MSD mount, plain
; `upload_protocol = mbed` (no --upload-port) still works.
upload_protocol = custom
upload_command = "$PROJECT_DIR/.venv/Scripts/python.exe" -m pyocd flash -t stm32h563zitx $SOURCE
; Must match UART_BAUD_RATE in src/main.cpp and the --baud defaults in tools/.
monitor_speed = 2000000
; STM32duino's stm32yyxx_hal_conf.h doesn't enable I3C by default (it's
; absent from that file's module list entirely, not just disabled). A
; project-level include/hal_conf_extra.h override was tried first but
; doesn't reach the framework's own SrcWrapper library build (that's
; compiled with its own narrower CPPPATH, not the project's include/ dir)
; -- a global build_flags define does, since it's applied at the compiler
; command-line level for every translation unit.
build_flags = -D HAL_I3C_MODULE_ENABLED
