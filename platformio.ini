; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nucleo_h563zi]
platform = ststm32
board = nucleo_h563zi
framework = arduino
; Upload goes to the ST-LINK's mbed virtual disk (auto-detected -- do NOT pass
; --upload-port; a COM port there makes it try to write COM5\firmware.bin).
;
; If upload fails with "Please specify `upload_port`" and no mbed drive is
; mounted, that's this machine's Defender Device Control filter driver
; (WdDevFlt) failing to attach to USB mass-storage volumes (Kernel-PnP event
; 219, status 0xC000038E) -- see CLAUDE.md. It's a USB driver-state fault, not
; a board/cable fault, and it has a known fix. The pyocd/SWD path below is the
; fallback that bypasses the mass-storage stack entirely; it needs a one-time:
;   .venv\Scripts\python.exe -m pyocd pack update
;   .venv\Scripts\python.exe -m pyocd pack install stm32h563zitx
; (.venv is gitignored, so this assumes the repo-root venv from CLAUDE.md.)
upload_protocol = mbed
;upload_protocol = custom
;upload_command = "$PROJECT_DIR/.venv/Scripts/python.exe" -m pyocd flash -t stm32h563zitx $SOURCE
; Must match UART_BAUD_RATE in src/main.cpp and the --baud defaults in tools/.
monitor_speed = 2000000
; STM32duino's stm32yyxx_hal_conf.h doesn't enable I3C by default (it's
; absent from that file's module list entirely, not just disabled). A
; project-level include/hal_conf_extra.h override was tried first but
; doesn't reach the framework's own SrcWrapper library build (that's
; compiled with its own narrower CPPPATH, not the project's include/ dir)
; -- a global build_flags define does, since it's applied at the compiler
; command-line level for every translation unit.
build_flags = -D HAL_I3C_MODULE_ENABLED
